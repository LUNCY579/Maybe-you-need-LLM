<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LLM Foundations Lab — an interactive, computed-from-scratch course on how large language models work, adapted from Foundations of Large Language Models by Tong Xiao and Jingbo Zhu."
    />
    <meta name="color-scheme" content="dark light" />
    <!--
      The manifest makes the course installable: it can be put on the home
      screen and opened without a browser chrome, and — because a service
      worker caches the whole build — it opens with no network at all.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="theme-color" content="#070b14" />
    <title>LLM Foundations Lab — Interactive Large Language Models Course</title>
    <script>
      /*
        Apply the theme before the first paint, so the page never flashes the
        wrong surface. The stored choice wins; otherwise the operating system's
        preference is used. This is the only place the theme is decided — the
        application reads the result back out of the document element.
      */
      try {
        var stored = window.localStorage.getItem('llm-foundations-lab:theme')
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
        var theme = stored === 'light' || stored === 'dark' ? stored : (prefersLight ? 'light' : 'dark')
        document.documentElement.classList.toggle('light', theme === 'light')
        document.documentElement.classList.toggle('dark', theme !== 'light')
      } catch (error) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
